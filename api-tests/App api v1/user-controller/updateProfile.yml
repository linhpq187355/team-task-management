info:
  name: updateProfile
  type: http
  seq: 2
  tags:
    - user-controller

http:
  method: PUT
  url: "{{baseUrl}}/api/users/me"
  body:
    type: json
    data: |-
      {
        "fullName": "",
        "avatarUrl": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/users/me"
      method: PUT
      body:
        type: json
        data: |-
          {
            "fullName": "",
            "avatarUrl": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "errorCode": "",
            "message": "",
            "data": {
              "id": 0,
              "email": "",
              "fullName": ""
            },
            "errors": []
          }
