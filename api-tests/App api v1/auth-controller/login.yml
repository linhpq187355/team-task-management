info:
  name: login
  type: http
  seq: 4
  tags:
    - auth-controller

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "errorCode": "",
            "message": "",
            "data": {
              "accessToken": "",
              "refreshToken": "",
              "user": {
                "id": 0,
                "email": "",
                "fullName": ""
              }
            },
            "errors": []
          }
