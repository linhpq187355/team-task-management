info:
  name: register
  type: http
  seq: 1
  tags:
    - auth-controller

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": "",
        "fullName": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "fullName": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "errorCode": "",
            "message": "",
            "data": "",
            "errors": []
          }
