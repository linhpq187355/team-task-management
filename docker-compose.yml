services:
  mysql:
    image: mysql:8.0
    container_name: team-task-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mysql:8.0
    container_name: team-task-db-init
    restart: "no"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "mysql -h mysql -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" < /scripts/01-reset-database.sql && \
      mysql -h mysql -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e \"CREATE USER IF NOT EXISTS '$${MYSQL_USER}'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';\" && \
      mysql -h mysql -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e \"GRANT ALL PRIVILEGES ON $${MYSQL_DATABASE}.* TO '$${MYSQL_USER}'@'%'; FLUSH PRIVILEGES;\""
    volumes:
      - ./docker/mysql/init:/scripts:ro

  # 'app' service removed to avoid building the project image during 'docker compose up'.
  # To run the application later, you can either run it locally with Maven, or
  # re-add an 'app' service or use a profile to start it on-demand.

volumes:
  mysql_data: